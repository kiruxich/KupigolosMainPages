<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f54622">
  <title>6 страниц</title>
  <style>
    :root { color-scheme: light; font-family: Manrope, Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100dvh; margin: 0; color: #273778; background: #f4f5f8; }
    main { width: min(1200px, calc(100% - 40px)); margin: 0 auto; padding: clamp(40px, 8vw, 112px) 0; }
    a { display: inline-block; margin-bottom: clamp(64px, 12vw, 150px); color: #687096; font-size: .85rem; font-weight: 700; text-decoration: none; }
    a:hover, a:focus-visible { color: #f54622; }
    a:focus-visible { outline: 3px solid rgba(245, 70, 34, .18); outline-offset: 5px; }
    h1 { margin: 0 0 14px; font-size: clamp(2.8rem, 7vw, 6.5rem); letter-spacing: -.065em; line-height: .95; }
    p { margin: 0; color: #687096; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <a href="index.html">← К проектам</a>
    <h1>6 страниц</h1>
    <p>Пока здесь пусто.</p>
  </main>
</body>
</html>
